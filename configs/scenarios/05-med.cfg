! ================================================================
! R1-Core - Scenario 05: MED (Multi-Exit Discriminator)
! ================================================================
! Project: bgp-deep-dive
! Phase: 1 (BGP Attributes — MED)
! Date: 2026-10-09
! ================================================================
!
! SCENARIO GOAL:
!   Control inbound traffic (from ISP to R1-Core) using MED.
!   - 192.168.100.0/24 → prefer Link 1 (MED=50)
!   - 192.168.200.0/24 → prefer Link 2 (MED=50)
!   - Both prefixes advertised from BOTH links (Redundancy!)
!
! KEY CONCEPT:
!   MED (Multi-Exit Discriminator)
!   - Lower = Better (opposite of Weight/LocPrf)
!   - Scope: Between two adjacent ASes
!   - Direction: OUT (advertising to neighbor)
!   - Default: 0
!   - Advertised only to directly connected AS
! ================================================================

hostname R1-Core
no ip domain-lookup
!
interface Loopback0
 ip address 1.1.1.1 255.255.255.255
!
interface GigabitEthernet3/0
 description === To R-ISP (Link 1) ===
 ip address 10.0.100.1 255.255.255.252
!
interface GigabitEthernet4/0
 description === To R-ISP (Link 2) ===
 ip address 10.0.101.1 255.255.255.252
!
interface GigabitEthernet5/0
 description === To R-ISP (Link 3) ===
 ip address 10.0.102.1 255.255.255.252
!
! ================================================================
! PREFIX-LISTS
! ================================================================
ip prefix-list pl-192-100 seq 5 permit 192.168.100.0/24
ip prefix-list pl-192-200 seq 5 permit 192.168.200.0/24
!
! ================================================================
! ROUTE-MAPS FOR MED
! ================================================================
!
! Link 1: 192.168.100.0 with MED=50, 192.168.200.0 with MED=100
route-map SET-MED-LINK1 permit 10
 match ip address prefix-list pl-192-100
 set metric 50
route-map SET-MED-LINK1 permit 20
 match ip address prefix-list pl-192-200
 set metric 100
!
! Link 2: 192.168.200.0 with MED=50, 192.168.100.0 with MED=100
route-map SET-MED-LINK2 permit 10
 match ip address prefix-list pl-192-200
 set metric 50
route-map SET-MED-LINK2 permit 20
 match ip address prefix-list pl-192-100
 set metric 100
!
! Link 3: block the two specific prefixes, allow everything else
route-map SET-MED-LINK3 deny 10
 match ip address prefix-list pl-192-100
route-map SET-MED-LINK3 deny 20
 match ip address prefix-list pl-192-200
route-map SET-MED-LINK3 permit 30
!
! ================================================================
! OSPF (for Return Path)
! ================================================================
router ospf 1
 router-id 1.1.1.1
 area 1 range 172.16.0.0 255.255.252.0
 area 2 range 172.17.0.0 255.255.252.0
 redistribute bgp 65001 subnets
 passive-interface Loopback0
 network 1.1.1.1 0.0.0.0 area 0
 network 10.0.0.0 0.0.0.3 area 1
 network 10.0.0.4 0.0.0.3 area 2
 network 10.0.0.8 0.0.0.3 area 0
 network 10.0.100.0 0.0.0.3 area 0
 network 10.0.101.0 0.0.0.3 area 0
 network 10.0.102.0 0.0.0.3 area 0
!
! ================================================================
! BGP
! ================================================================
router bgp 65001
 bgp router-id 1.1.1.1
 bgp log-neighbor-changes
 network 1.1.1.1 mask 255.255.255.255
 network 10.0.100.0 mask 255.255.255.252
 network 10.0.101.0 mask 255.255.255.252
 network 10.0.102.0 mask 255.255.255.252
 redistribute ospf 1 match internal external 1 external 2
 neighbor 10.0.100.2 remote-as 65002
 neighbor 10.0.100.2 weight 200
 neighbor 10.0.100.2 route-map SET-MED-LINK1 out
 neighbor 10.0.101.2 remote-as 65002
 neighbor 10.0.101.2 route-map SET-LP in
 neighbor 10.0.101.2 route-map SET-MED-LINK2 out
 neighbor 10.0.102.2 remote-as 65002
 neighbor 10.0.102.2 description link-to-ISP
 neighbor 10.0.102.2 route-map SET-MED-LINK3 out
!
end
