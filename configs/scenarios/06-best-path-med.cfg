! ================================================================
! R-ISP - Scenario 06: MED (Best Path Test 4)
! ================================================================
! Project: bgp-deep-dive
! Phase: 2 (Best Path Selection — Test 4: MED)
! Date: 2026-10-09
! ================================================================
!
! SCENARIO GOAL:
!   Prove that LOWER MED = BETTER
!   Demonstrate default MED=0 behavior
!
! LINKS:
!   Link 1 (10.0.100.1): MED=10
!   Link 2 (10.0.101.1): MED=7
!   Link 3 (10.0.102.1): default (MED=0) ← ← WINS!
!
! KEY OBSERVATION:
!   Default MED=0 (LOWEST value)
!   So unconfigured links always win over configured ones!
! ================================================================

hostname R-ISP
no ip domain-lookup
!
interface Loopback0
 ip address 9.9.9.9 255.255.255.255
!
interface GigabitEthernet0/0
 description === To R1-Core (Link 1) ===
 ip address 10.0.100.2 255.255.255.252
!
interface GigabitEthernet1/0
 description === To R1-Core (Link 2) ===
 ip address 10.0.101.2 255.255.255.252
!
interface GigabitEthernet2/0
 description === To R1-Core (Link 3) ===
 ip address 10.0.102.2 255.255.255.252
!
! ================================================================
! ROUTE-MAPS FOR MED
! ================================================================
route-map SET-MED permit 10
 set metric 10
!
route-map SET-MED2 permit 10
 set metric 7
!
! ================================================================
! BGP
! ================================================================
router bgp 65002
 bgp router-id 9.9.9.9
 bgp log-neighbor-changes
 network 9.9.9.9 mask 255.255.255.255
 neighbor 10.0.100.1 remote-as 65001
 neighbor 10.0.100.1 route-map SET-MED out
 neighbor 10.0.101.1 remote-as 65001
 neighbor 10.0.101.1 route-map SET-MED2 out
 neighbor 10.0.102.1 remote-as 65001
 neighbor 10.0.102.1 description link3-to-R-Core
!
end
