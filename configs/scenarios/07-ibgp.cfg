! ============================================================
! Phase 3: iBGP Configuration
! Project: BGP Deep Dive
! Author: Armin Isa
! ============================================================

! ------------------------------------------------------------
! R1-Core (AS 65001) - iBGP Side
! ------------------------------------------------------------
router bgp 65001
 bgp router-id 1.1.1.1
 network 1.1.1.1 mask 255.255.255.255
 network 10.0.100.0 mask 255.255.255.252
 network 10.0.101.0 mask 255.255.255.252
 network 10.0.102.0 mask 255.255.255.252
 redistribute ospf 1 match internal external 1 external 2
 neighbor 10.0.100.2 remote-as 65002
 neighbor 10.0.101.2 remote-as 65002
 neighbor 10.0.102.2 remote-as 65002
 neighbor 10.10.10.10 remote-as 65001
 neighbor 10.10.10.10 description === iBGP To R2-iBGP ===
 neighbor 10.10.10.10 update-source Loopback0
 neighbor 10.10.10.10 next-hop-self

! ------------------------------------------------------------
! R2-iBGP (AS 65001) - Full Config
! ------------------------------------------------------------
hostname R2-iBGP
!
interface Loopback0
 ip address 10.10.10.10 255.255.255.255
!
interface GigabitEthernet0/0
 description === To R1-Core (iBGP Link) ===
 ip address 10.0.200.2 255.255.255.252
!
router ospf 1
 router-id 10.10.10.10
 network 10.0.200.0 0.0.0.3 area 0
 network 10.10.10.10 0.0.0.0 area 0
 distribute-list route-map RM-BGP in
!
route-map RM-BGP deny 10
 match tag 65002
 exit
route-map RM-BGP permit 20
 exit
!
router bgp 65001
 bgp router-id 10.10.10.10
 bgp log-neighbor-changes
 no synchronization
 network 10.10.10.10 mask 255.255.255.255
 neighbor 1.1.1.1 remote-as 65001
 neighbor 1.1.1.1 description === iBGP to R1-Core ===
 neighbor 1.1.1.1 update-source Loopback0
!
end
write memory
